<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d5fe0">
<title>Toko Online Apotek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--surface:#fff;--line:#e2e8f3;--ink:#16233f;--ink2:#46557a;--ink3:#7d8aa5;--pri:#1d5fe0;--pri-d:#1648b3;--pri-s:#e5eeff;--navy:#123a8c;--green:#16a34a;--green-s:#e2f6e9;--red:#e0353b;--red-s:#fde8e8;--amber:#f59e0b;--amber-s:#fff4dc;--r:14px;--sh:0 1px 2px rgba(20,50,110,.05),0 6px 20px rgba(20,50,110,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hd{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.brand img{max-height:40px;max-width:120px;object-fit:contain}
.brand b{display:block;font-size:17px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:11.5px;color:var(--ink2);font-weight:600}
.sp{flex:1}
.hbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;font-weight:600;color:var(--ink2)}
.hbtn:hover{background:var(--bg)}
.cartbtn{position:relative;background:var(--pri);color:#fff}.cartbtn:hover{background:var(--pri-d)}
.cnt{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:20px;font-size:11px;font-weight:800;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.hero{background:linear-gradient(120deg,#1d5fe0,#123a8c);color:#fff;border-radius:var(--r);padding:22px 24px;margin:18px 0 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:22px;font-weight:800;letter-spacing:-.02em}.hero p{opacity:.9;margin-top:4px}
.note{border-radius:10px;padding:11px 14px;font-weight:600;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.note.warn{background:var(--amber-s);color:#8a4d00;border:1px solid #fbdc9c}.note.info{background:var(--pri-s);color:var(--pri-d);border:1px solid #c6d8fb}.note.err{background:var(--red-s);color:#b8232a;border:1px solid #f6c5c7}
.srch{position:relative;margin-bottom:12px}.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.inp,.sel{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:#fff;outline:none;width:100%}
.srch .inp{padding-left:42px;height:48px;font-size:15px}
.inp:focus,.sel:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(29,95,224,.14)}
textarea.inp{height:auto;padding:10px 14px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);font-weight:600;color:var(--ink2);font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.prod{padding:14px;display:flex;flex-direction:column;gap:8px}
.pic{height:96px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri-s),#f4f8ff);color:var(--pri)}
.pic svg{width:40px;height:40px;stroke-width:1.6}
.prod h3{font-size:14.5px;font-weight:700;line-height:1.3}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.b-gray{background:#eef2f8;color:var(--ink2)}.b-amber{background:var(--amber-s);color:#a55d00}.b-red{background:var(--red-s);color:#b8232a}.b-green{background:var(--green-s);color:#11793a}.b-blue{background:var(--pri-s);color:var(--pri-d)}
.price{font-size:18px;font-weight:800;color:var(--pri)}.price small{font-size:12px;color:var(--ink3);font-weight:600}
.prod .row{display:flex;gap:8px;margin-top:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14px;white-space:nowrap;transition:.15s}
.btn-p{background:var(--pri);color:#fff}.btn-p:hover{background:var(--pri-d)}.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-o{background:#fff;border:1px solid var(--line);color:var(--ink2)}.btn-o:hover{border-color:var(--pri);color:var(--pri)}
.btn-g{background:var(--green);color:#fff}
.btn-sm{height:34px;padding:0 12px;font-size:13px}
.unit{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:#fff;flex:1;min-width:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:34px;height:34px;font-size:18px;font-weight:700;color:var(--pri)}.stepper span{min-width:30px;text-align:center;font-weight:700}
.empty{padding:40px 16px;text-align:center;color:var(--ink3)}
/* drawer */
.dbg{position:fixed;inset:0;background:rgba(15,30,60,.4);z-index:40;display:none}.dbg.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;background:#fff;z-index:41;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
.drawer.show{transform:none}
.dh{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.dh h2{flex:1;font-size:17px}
.db{flex:1;overflow-y:auto;padding:12px 18px}
.df{border-top:1px solid var(--line);padding:16px 18px}
.ci{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .n{flex:1;min-width:0}.ci b{display:block;font-size:14px}.ci small{color:var(--ink3)}
.sum{display:flex;justify-content:space-between;padding:5px 0;color:var(--ink2)}.sum.t{font-size:17px;font-weight:800;color:var(--ink);border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
/* pages */
.page{display:none;padding:18px 0 48px}.page.on{display:block}
.two{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.sec{padding:18px;margin-bottom:14px}.sec h2{font-size:16px;margin-bottom:12px}
.fld{margin-bottom:12px}.fld label{display:block;font-weight:600;font-size:13px;color:var(--ink2);margin-bottom:6px}
.opt{display:flex;gap:10px;flex-wrap:wrap}
.opt label{flex:1;min-width:140px;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;display:flex;gap:9px;align-items:flex-start;font-weight:600}
.opt label small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
.opt input{margin-top:3px;accent-color:var(--pri)}
.opt label:has(input:checked){border-color:var(--pri);background:var(--pri-s)}
.upl{border:1.5px dashed #b9c8e6;border-radius:10px;padding:14px;text-align:center;background:#fafcff;cursor:pointer}
.upl img{max-width:100%;max-height:180px;border-radius:8px;margin-top:8px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink2);margin-bottom:12px}
.big{font-size:26px;font-weight:800;color:var(--pri);letter-spacing:.02em}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}
.tl div{position:relative;padding:6px 0}.tl div::before{content:'';position:absolute;left:-23px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--pri);border:2px solid #fff;box-shadow:0 0 0 1px var(--pri)}
.qris{max-width:240px;width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:#123a8c;color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px rgba(15,30,60,.3);animation:tin .25s;max-width:90vw}
.tst.err{background:#b8232a}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.tabs2{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:14px}.tabs2 button{flex:1;height:38px;border-radius:8px;font-weight:700;color:var(--ink2)}.tabs2 button.on{background:#fff;color:var(--pri);box-shadow:var(--sh)}
.mcard{background:linear-gradient(120deg,#1d5fe0,#123a8c);color:#fff;border-radius:var(--r);padding:20px}.mcard small{opacity:.85}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:default}.stat small{color:var(--ink2);font-size:12.5px}.stat b{display:block;font-size:20px;font-weight:800;margin-top:2px}
footer{border-top:1px solid var(--line);background:#fff;padding:20px 0;color:var(--ink2);font-size:13px}
.two>*,.grid>*{min-width:0}
@media (min-width:821px) and (max-width:1100px){.two{grid-template-columns:1fr 320px}.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.inp,.sel,textarea.inp,.unit,.srch .inp{font-size:16px}.sec{padding:16px}.drawer{max-width:100%}.df{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .opt label{min-width:100%}.big{font-size:22px}}
@media (max-width:820px){.two{grid-template-columns:1fr}.hbtn .t{display:none}.hd{gap:4px}.hbtn{padding:0 9px}.brand small{display:none}.brand b{font-size:15px}.brand img{max-width:90px;max-height:34px}.brand svg{width:30px;height:30px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.prod{padding:10px}.pic{height:70px}.prod .row{flex-direction:column}.hero{padding:18px}.hero h1{font-size:19px}}
@media (min-width:600px) and (max-width:820px){.grid{grid-template-columns:repeat(3,1fr)}.prod .row{flex-direction:row}}
</style>
</head>
<body>
<header><div class="wrap hd">
  <div class="brand" onclick="go('')"><span id="bLogo"></span><div style="min-width:0"><b id="bNama">Apotek</b><small id="bTag"></small></div></div>
  <div class="sp"></div>
  <button class="hbtn" id="akunBtn" onclick="go(AKUN?'akun':'masuk')"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="t" id="akunLbl">Masuk</span></button>
  <button class="hbtn" onclick="go('tagihan')"><svg class="i" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span class="t">Tagihan</span></button>
  <button class="hbtn" onclick="go('cek')"><svg class="i" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="t">Cek Pesanan</span></button>
  <button class="hbtn cartbtn" onclick="openCart()"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/></svg><span class="t">Keranjang</span><span class="cnt" id="cnt" style="display:none">0</span></button>
</div></header>

<main class="wrap">
  <section class="page on" id="p-home"></section>
  <section class="page" id="p-checkout"></section>
  <section class="page" id="p-sukses"></section>
  <section class="page" id="p-cek"></section>
  <section class="page" id="p-tagihan"></section>
  <section class="page" id="p-masuk"></section>
  <section class="page" id="p-akun"></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<div class="dbg" id="dbg" onclick="closeCart()"></div>
<aside class="drawer" id="drawer"></aside>
<div id="toast"></div>

<script>
/* ===== Toko online Apotek — tersambung ke server Dian Farma ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const ICON_PILL='<svg class="i" viewBox="0 0 24 24"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7z"/><path d="m8.5 8.5 7 7"/></svg>';
const CROSS='<svg viewBox="0 0 40 40" width="36" height="36"><path d="M14 3h12v11h11v12H26v11H14V26H3V14h11z" fill="#22b573"/><path d="M20 12v16M12 20h16" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>';
let KHUSUS=false,AKUN=null,CT=null,INFO=null,PROD=[],KATS=[],KAT='Semua',Q='',CART=[],DISKON=0,RESEP='',LAST=null;
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
CART=ls.get('toko-cart',[]);
function toast(m,t){const e=document.createElement('div');e.className='tst '+(t||'');e.textContent=m;$('#toast').appendChild(e);setTimeout(()=>e.remove(),3000)}
try{CT=localStorage.getItem('toko-token')}catch(e){}
async function api(p,opt={}){const r=await fetch(p,{method:opt.method||'GET',headers:{'Content-Type':'application/json',...(CT?{Authorization:'Bearer '+CT}:{})},body:opt.body?JSON.stringify(opt.body):undefined});let j={};try{j=await r.json()}catch(e){}if(r.status===401&&CT&&p.startsWith('/api/akun/')){setAkun(null,null)}if(!r.ok)throw new Error(j.message||'Koneksi gagal, coba lagi');return j}
function setAkun(data,token){AKUN=data;if(token!==undefined){CT=token;try{token?localStorage.setItem('toko-token',token):localStorage.removeItem('toko-token')}catch(e){}}
  $('#akunLbl').textContent=AKUN?AKUN.nama.split(' ')[0]:'Masuk';DISKON=AKUN&&AKUN.member?AKUN.member.diskon:0;
  if(AKUN){F.nama=AKUN.nama;F.telp=AKUN.telp;if(AKUN.alamat&&!F.alamat)F.alamat=AKUN.alamat}}

/* ---------- Navigasi ---------- */
function go(h){location.hash=h}
function route(){const h=location.hash.slice(1);document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  if(h==='checkout'){if(!CART.length)return go('');$('#p-checkout').classList.add('on');renderCheckout()}
  else if(h==='sukses'&&LAST){$('#p-sukses').classList.add('on');renderSukses()}
  else if(h==='masuk'){if(AKUN)return go('akun');$('#p-masuk').classList.add('on');renderMasuk()}
  else if(h==='akun'){if(!AKUN)return go('masuk');$('#p-akun').classList.add('on');renderAkun();refreshAkun()}
  else if(h==='tagihan'){$('#p-tagihan').classList.add('on');renderTagihan()}
  else if(h.startsWith('cek')){$('#p-cek').classList.add('on');renderCek(decodeURIComponent(h.split('/')[1]||''))}
  else{$('#p-home').classList.add('on');renderHome()}
  window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

/* ---------- Data ---------- */
async function init(){
  try{const j=await api('/api/toko/info');
    if(!j.siap){$('#p-home').innerHTML='<div class="empty" style="padding:80px 16px"><h2>Toko belum siap</h2><p>Apotek sedang menyiapkan toko online. Silakan kembali lagi nanti.</p></div>';return}
    INFO=j.data;document.title=INFO.nama+' — Toko Online';$('#bNama').textContent=INFO.nama;$('#bTag').textContent=INFO.tagline||'';
    $('#bLogo').innerHTML=INFO.logo?`<img src="${esc(INFO.logo)}" alt="">`:CROSS;
    $('#foot').innerHTML=`<b>${esc(INFO.nama)}</b> · ${esc(INFO.alamat||'')} ${INFO.telp?'· Telp '+esc(INFO.telp):''}${INFO.jam?'<br>Jam buka: '+esc(INFO.jam):''}<br><span style="color:var(--ink3)">Obat keras hanya dilayani dengan resep dokter dan diperiksa apoteker.</span>`;
    await loadProduk();
    if(CT){try{setAkun((await api('/api/akun/saya')).data)}catch(e){}}
  }catch(e){$('#p-home').innerHTML=`<div class="empty" style="padding:80px 16px"><h2>Tidak bisa terhubung</h2><p>${esc(e.message)}</p><button class="btn btn-p" style="margin-top:14px" onclick="init()">Coba lagi</button></div>`;return}
  updCnt();route()}
async function loadProduk(){const j=await api('/api/toko/produk');PROD=j.items;KHUSUS=!!j.khusus;
  CART=CART.filter(c=>PROD.some(p=>p.id===c.id));saveCart()}
const prodBy=id=>PROD.find(p=>p.id===id);
const unitOf=(p,isi)=>isi>1&&p.besar?{nama:p.besar.nama,isi:p.besar.isi,harga:p.besar.harga}:{nama:p.satuan,isi:1,harga:p.harga};

/* ---------- Beranda ---------- */
function renderHome(){if(!INFO)return;
  const kats=KATS=['Semua',...[...new Set(PROD.map(p=>p.kategori))].sort()];
  $('#p-home').innerHTML=`<div class="hero"><div style="flex:1;min-width:220px"><h1>Pesan obat dari rumah</h1><p>${esc(INFO.tagline||'Diantar atau ambil di apotek')}</p></div>${INFO.wa?`<a class="btn" style="background:#fff;color:var(--pri)" href="https://wa.me/${esc(INFO.wa.replace(/^0/,'62'))}" target="_blank" rel="noopener">Tanya Apoteker via WhatsApp</a>`:''}</div>
   ${!INFO.buka?'<div class="note err">Toko sedang tutup — pesanan belum bisa dibuat.</div>':''}${KHUSUS?'<div class="note info">Harga yang tampil sudah harga khusus untuk Anda.</div>':''}${INFO.info?`<div class="note info">${esc(INFO.info)}</div>`:''}
   <div class="srch"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="inp" id="q" placeholder="Cari obat, vitamin, atau kategori…" value="${esc(Q)}" oninput="Q=this.value;renderGrid()"></div>
   <div class="chips">${kats.map((k,i)=>`<button class="chip ${k===KAT?'on':''}" onclick="KAT=KATS[${i}];renderHome()">${esc(k)}</button>`).join('')}</div>
   <div class="grid" id="grid"></div>`;
  renderGrid()}
function renderGrid(){const q=Q.toLowerCase();const L=PROD.filter(p=>(KAT==='Semua'||p.kategori===KAT)&&(p.nama.toLowerCase().includes(q)||p.kategori.toLowerCase().includes(q)));
  $('#grid').innerHTML=L.map(p=>{const habis=p.tersedia<1;return `<div class="card prod"><div class="pic">${ICON_PILL}</div>
    <div class="meta"><span class="badge b-gray">${esc(p.kategori)}</span>${p.resep?'<span class="badge b-amber" title="Perlu foto resep dokter">Perlu resep</span>':''}${habis?'<span class="badge b-red">Habis</span>':p.tersedia<=10?`<span class="badge b-red">Sisa ${p.tersedia} ${esc(p.satuan)}</span>`:''}</div>
    <h3>${esc(p.nama)}</h3>
    <div class="price" id="pr${p.id}">${rp(p.harga)} <small>/ ${esc(p.satuan)}</small></div>
    <div class="row">${p.besar?`<select class="unit" id="u${p.id}" onchange="updPrice(${p.id})"><option value="1">${esc(p.satuan)}</option><option value="${p.besar.isi}">${esc(p.besar.nama)} (${p.besar.isi} ${esc(p.satuan)})</option></select>`:''}
    <button class="btn btn-p" style="flex:1" ${habis||!INFO.buka?'disabled':''} onclick="addCart(${p.id})">+ Keranjang</button></div></div>`}).join('')||'<div class="empty" style="grid-column:1/-1">Produk tidak ditemukan</div>'}
function updPrice(id){const p=prodBy(id),u=unitOf(p,+$('#u'+id).value);$('#pr'+id).innerHTML=`${rp(u.harga)} <small>/ ${esc(u.nama)}</small>`}

/* ---------- Keranjang ---------- */
function saveCart(){ls.set('toko-cart',CART);updCnt()}
function updCnt(){const n=CART.reduce((s,c)=>s+c.qty,0);$('#cnt').textContent=n;$('#cnt').style.display=n?'':'none'}
const used=(id,skip)=>CART.filter((c,i)=>c.id===id&&i!==skip).reduce((s,c)=>s+c.qty*c.isi,0);
function addCart(id){const p=prodBy(id),isi=$('#u'+id)?+$('#u'+id).value:1;
  if(used(id)+isi>p.tersedia)return toast('Stok tidak mencukupi','err');
  const c=CART.find(c=>c.id===id&&c.isi===isi);if(c)c.qty++;else CART.push({id,isi,qty:1});saveCart();toast(p.nama+' ditambahkan ke keranjang')}
function setQty(i,d){const c=CART[i],p=prodBy(c.id),q=c.qty+d;if(q<1){CART.splice(i,1)}else{if(used(c.id,i)+q*c.isi>p.tersedia)return toast('Stok tidak mencukupi','err');c.qty=q}saveCart();renderCart();if(location.hash==='#checkout')renderCheckout()}

  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);const url=c.toDataURL('image/jpeg',.82);

  const T=(k,l)=>`<button class="${MTAB===k?'on':''}" onclick="MTAB='${k}';renderMasuk()">${l}</button>`;
  let b='';
  if(MTAB==='masuk')b=`<div class="fld"><label>Nomor HP</label><input class="inp" id="a_telp" inputmode="tel" value="${esc(f.telp||'')}" autocomplete="tel"></div>
    <div class="fld"><label>Password</label><input class="inp" id="a_pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')akunMasuk()"></div>
    <button class="btn btn-p" id="a_btn" style="width:100%;height:46px" onclick="akunMasuk()">Masuk</button>
    <p style="text-align:center;margin-top:12px;font-size:13px"><a href="#" onclick="MTAB='reset';renderMasuk();return false">Lupa password?</a></p>`;
  else if(MTAB==='daftar')b=`<div class="fld"><label>Nama lengkap</label><input class="inp" id="a_nama" value="${esc(f.nama||'')}" autocomplete="name"></div>
    <div class="fld"><label>Nomor HP / WhatsApp</label><input class="inp" id="a_telp" inputmode="tel" value="${esc(f.telp||'')}" autocomplete="tel"></div>
    <div class="fld"><label>Alamat <span style="font-weight:500;color:var(--ink3)">(opsional, untuk pengiriman)</span></label><textarea class="inp" id="a_alamat" rows="2">${esc(f.alamat||'')}</textarea></div>
    <div class="fld"><label>Password (min. 6 karakter)</label><input class="inp" id="a_pw" type="password" autocomplete="new-password"></div>
    <div class="fld"><label>PIN dari apotek <span style="font-weight:500;color:var(--ink3)">(opsional)</span></label><input class="inp" id="a_pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6 angka"><small style="color:var(--ink3);display:block;margin-top:4px">Sudah jadi pelanggan apotek? Isi PIN agar akun terhubung: harga member, saldo bonus, dan tagihan tampil otomatis.</small></div>
    <button class="btn btn-p" id="a_btn" style="width:100%;height:46px" onclick="akunDaftar()">Daftar</button>`;
  else b=`<p style="color:var(--ink2);margin-bottom:12px;font-size:13.5px">Atur ulang password memakai <b>PIN dari apotek</b>. Belum punya PIN? Hubungi apotek${INFO&&INFO.wa?` lewat <a target="_blank" rel="noopener" href="https://wa.me/${esc(INFO.wa.replace(/^0/,'62'))}?text=${encodeURIComponent('Halo, saya lupa password akun toko online.')}">WhatsApp</a>`:''}.</p>
    <div class="fld"><label>Nomor HP</label><input class="inp" id="a_telp" inputmode="tel" value="${esc(f.telp||'')}"></div>
    <div class="fld"><label>PIN dari apotek</label><input class="inp" id="a_pin" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    <div class="fld"><label>Password baru</label><input class="inp" id="a_pw" type="password" autocomplete="new-password"></div>
    <button class="btn btn-p" id="a_btn" style="width:100%;height:46px" onclick="akunReset()">Simpan Password Baru</button>
    <p style="text-align:center;margin-top:12px;font-size:13px"><a href="#" onclick="MTAB='masuk';renderMasuk();return false">Kembali ke Masuk</a></p>`;
  $('#p-masuk').innerHTML=`<div style="max-width:440px;margin:10px auto"><div class="card sec"><h1 style="font-size:20px;margin-bottom:4px">${MTAB==='reset'?'Lupa Password':'Akun Pelanggan'}</h1><p style="color:var(--ink2);margin-bottom:14px;font-size:13.5px">Belanja lebih cepat, pantau pesanan, tagihan &amp; bonus Anda.</p>
   ${MTAB!=='reset'?`<div class="tabs2">${T('masuk','Masuk')}${T('daftar','Daftar')}</div>`:''}${b}<div id="a_err" style="color:var(--red);font-size:13px;margin-top:10px;min-height:18px"></div></div></div>`}
async function akunKirim(path,body){const b=$('#a_btn'),t=b.textContent;b.disabled=true;b.textContent='Memproses…';$('#a_err').textContent='';
  try{const j=await api(path,{method:'POST',body});setAkun(j.data,j.token);ls.set('toko-pembeli',{...ls.get('toko-pembeli',{}),nama:j.data.nama,telp:j.data.telp,alamat:j.data.alamat||ls.get('toko-pembeli',{}).alamat||''});toast('Selamat datang, '+j.data.nama.split(' ')[0]+'!');try{await loadProduk()}catch(e){}go(CART.length?'checkout':'akun')}
  catch(e){$('#a_err').textContent=e.message;b.disabled=false;b.textContent=t}}
const akunMasuk=()=>akunKirim('/api/akun/masuk',{telp:$('#a_telp').value,password:$('#a_pw').value});
const akunDaftar=()=>akunKirim('/api/akun/daftar',{nama:$('#a_nama').value,telp:$('#a_telp').value,alamat:$('#a_alamat').value,password:$('#a_pw').value,pin:$('#a_pin').value.trim()||undefined});
const akunReset=()=>akunKirim('/api/akun/reset',{telp:$('#a_telp').value,pin:$('#a_pin').value.trim(),baru:$('#a_pw').value});
const STB={baru:['Menunggu konfirmasi','b-amber'],diproses:['Disiapkan','b-blue'],dikirim:['Dikirim','b-blue'],siap:['Siap diambil','b-green'],selesai:['Selesai','b-green'],dibatalkan:['Dibatalkan','b-red']};
function renderAkun(){const a=AKUN;if(!a)return;const m=a.member;
  $('#p-akun').innerHTML=`<div style="max-width:760px;margin:0 auto">
   <div class="mcard"><small>Halo,</small><div style="font-size:22px;font-weight:800">${esc(a.nama)}</div><small>${esc(a.telp)}</small>
    <div style="margin-top:10px">${m?`<span class="badge" style="background:rgba(255,255,255,.2);color:#fff;font-size:12.5px;padding:4px 12px">${m.hargaKhusus!=null?'Pelanggan harga khusus':'Member '+esc(m.kategori)+(m.diskon?' · diskon '+m.diskon+'%':'')}</span>`:'<span class="badge" style="background:rgba(255,255,255,.2);color:#fff;font-size:12.5px;padding:4px 12px">Akun belum terhubung ke data apotek</span>'}</div></div>
   ${!m&&a.bisaVerifikasi?`<div class="card sec" style="margin-top:14px;border-color:#fbdc9c;background:var(--amber-s)"><h2>Hubungkan dengan data pelanggan apotek</h2><p style="color:#8a4d00;font-size:13.5px;margin-bottom:10px">Nomor Anda terdaftar sebagai pelanggan apotek. Masukkan PIN dari apotek untuk melihat harga member, saldo bonus, dan tagihan.</p><div style="display:flex;gap:8px"><input class="inp" id="v_pin" inputmode="numeric" maxlength="6" placeholder="PIN 6 angka" style="max-width:180px"><button class="btn btn-p" onclick="akunVerif()">Hubungkan</button></div></div>`:''}
   ${m?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px">
     <a class="stat" href="#tagihan" style="text-decoration:none;color:inherit;cursor:pointer"><small>Sisa hutang</small><b style="color:${m.total?'var(--red)':'var(--green)'}">${rp(m.total)}</b>${m.lewat?`<span class="badge b-red">Lewat tempo ${rp(m.lewat)}</span>`:'<small>Lihat rincian →</small>'}</a>
     <div class="stat"><small>Saldo bonus</small><b style="color:var(--green)">${rp(m.bonus)}</b><small>Bisa dipakai saat belanja di apotek</small></div>
     ${m.limit?`<div class="stat"><small>Sisa limit kredit</small><b>${rp(Math.max(0,m.limit-m.total))}</b><small>Termin ${m.termin} hari</small></div>`:''}</div>`:''}
   <div class="card sec" style="margin-top:14px"><h2>Pesanan Online Saya</h2>${a.pesanan.length?a.pesanan.map(o=>`<a class="ci" href="#cek/${esc(o.kode)}" style="text-decoration:none;color:inherit"><div class="n"><b>${esc(o.kode)}</b><small>${new Date(o.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})} · ${o.items} produk</small></div><div style="text-align:right"><b>${rp(o.total)}</b><br><span class="badge ${(STB[o.status]||['','b-gray'])[1]}">${(STB[o.status]||[o.status])[0]}</span></div></a>`).join(''):'<div class="empty" style="padding:16px">Belum ada pesanan. <a href="#">Mulai belanja</a></div>'}</div>
   ${m&&m.belanja.length?`<div class="card sec"><h2>Riwayat Belanja di Apotek</h2>${m.belanja.map(x=>`<div class="ci"><div class="n"><b>${esc(x.no)}</b><small>${esc(x.tgl)} · ${esc(x.metode||'')}</small><small style="display:block">${esc(x.items.slice(0,3).join(', '))}${x.items.length>3?' …':''}</small></div><b>${rp(x.total)}</b></div>`).join('')}</div>`:''}
   <div class="card sec"><h2>Profil</h2><div class="fld"><label>Nama</label><input class="inp" id="pf_nama" value="${esc(a.nama)}"></div><div class="fld"><label>Alamat pengiriman</label><textarea class="inp" id="pf_alamat" rows="2">${esc(a.alamat)}</textarea></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-p" onclick="akunProfil()">Simpan Profil</button><button class="btn btn-o" onclick="akunPwForm()">Ganti Password</button><button class="btn btn-o" style="color:var(--red)" onclick="akunKeluar()">Keluar</button></div><div id="pwBox"></div></div></div>`}
async function akunVerif(){try{setAkun((await api('/api/akun/verifikasi',{method:'POST',body:{pin:$('#v_pin').value.trim()}})).data);await loadProduk();toast('Akun terhubung dengan data apotek');renderAkun()}catch(e){toast(e.message,'err')}}
async function akunProfil(){try{setAkun((await api('/api/akun/profil',{method:'PUT',body:{nama:$('#pf_nama').value,alamat:$('#pf_alamat').value}})).data);F.alamat=AKUN.alamat;toast('Profil disimpan');renderAkun()}catch(e){toast(e.message,'err')}}
function akunPwForm(){$('#pwBox').innerHTML=`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px"><div class="fld"><label>Password lama</label><input class="inp" id="pw_l" type="password" autocomplete="current-password"></div><div class="fld"><label>Password baru (min. 6)</label><input class="inp" id="pw_b" type="password" autocomplete="new-password"></div><button class="btn btn-p" onclick="akunPw()">Simpan Password</button></div>`}
async function akunPw(){try{const j=await api('/api/akun/password',{method:'POST',body:{lama:$('#pw_l').value,baru:$('#pw_b').value}});setAkun(AKUN,j.token);$('#pwBox').innerHTML='';toast('Password diganti')}catch(e){toast(e.message,'err')}}
function akunKeluar(){setAkun(null,null);F.nama='';F.telp='';toast('Anda sudah keluar');go('');loadProduk().then(route).catch(()=>{})}

init();
</script>
</body>
</html>
