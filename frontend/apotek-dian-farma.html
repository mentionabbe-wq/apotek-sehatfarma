<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d5fe0">
<title>Apotek Dian Farma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3fb;--surface:#fff;--line:#e2e8f3;--line2:#eef2f8;
  --ink:#16233f;--ink2:#46557a;--ink3:#7d8aa5;
  --pri:#1d5fe0;--pri-d:#1648b3;--pri-s:#e5eeff;--navy:#123a8c;
  --green:#16a34a;--green-s:#e2f6e9;--red:#e0353b;--red-s:#fde8e8;--amber:#f59e0b;--amber-s:#fff4dc;
  --r:12px;--sh:0 1px 2px rgba(20,50,110,.05),0 6px 20px rgba(20,50,110,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c7d3ea;border-radius:8px}

/* ===== Layout ===== */
.top{position:sticky;top:0;z-index:30;height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;box-shadow:0 1px 0 rgba(20,50,110,.03)}
.logo{display:flex;align-items:center;gap:11px}
.logo .cross{width:38px;height:38px;flex-shrink:0}
.logo b{display:block;font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.05}
.logo small{font-size:11.5px;color:var(--ink2);font-weight:600}
.top .sp{flex:1}
.bell{position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.bell:hover{background:var(--bg)}
.bell .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.user{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:30px}
.user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffd9b8,#f2a97e);display:grid;place-items:center;font-weight:800;color:#7a3a14;font-size:14px}
.user b{display:block;font-size:13px;color:var(--pri);font-weight:700;line-height:1.1}
.user small{font-size:11.5px;color:var(--ink3)}
.burger{display:none;width:38px;height:38px;border-radius:10px;place-items:center}
.wrap{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 64px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;display:flex;flex-direction:column}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--ink2);font-weight:500;text-decoration:none;margin-bottom:2px;cursor:pointer;font-size:13.5px}
.nav a:hover{background:#f3f6fc;color:var(--ink)}
.nav a.on{background:var(--pri-s);color:var(--pri);font-weight:700}
.nav a.on svg{stroke:var(--pri)}
.ver{margin-top:auto;padding:12px;font-size:11.5px;color:var(--ink3)}
main{padding:22px 26px 40px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.ph .sp{flex:1}
.scrim{display:none}

/* ===== Komponen ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:12px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}.card-h h3{margin:0}.card-h .sp{flex:1}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:9px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:.15s}
.btn svg.i{width:16px;height:16px}
.btn-p{background:var(--pri);color:#fff;box-shadow:0 3px 10px rgba(29,95,224,.25)}.btn-p:hover{background:var(--pri-d)}
.btn-g{background:#eef2f8;color:var(--ink)}.btn-g:hover{background:#e2e8f3}
.btn-o{background:#fff;border:1px solid var(--line);color:var(--ink2)}.btn-o:hover{border-color:var(--pri);color:var(--pri)}
.btn-green{background:var(--green-s);color:#11793a;border:1px solid #bfe8cd}.btn-green:hover{background:#d2f0dd}
.btn-red{background:var(--red-s);color:#b8232a;border:1px solid #f6c5c7}.btn-red:hover{background:#fbd9da}
.btn-lg{height:46px;font-size:15px;padding:0 24px}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:7px}
.ib{width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;color:var(--pri)}
.ib:hover{background:var(--pri-s)}.ib.del{color:var(--red)}.ib.del:hover{background:var(--red-s)}
.ib svg.i{width:16px;height:16px}
.inp,.sel{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:#fff;outline:none;width:100%;transition:.15s}
.inp:focus,.sel:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(29,95,224,.14)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.srch{position:relative}.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);width:16px;height:16px}.srch .inp{padding-left:34px}
.frm{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.frm label,.lbl{font-weight:600;color:var(--ink2);font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
.fld label{display:block;font-weight:600;color:var(--ink2);font-size:12.5px;margin-bottom:5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:600;color:var(--ink2);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--pri)}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);background:var(--pri-s)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse}
th{background:#f4f7fc;color:var(--ink2);font-weight:700;font-size:12.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8faff}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
.empty{padding:26px;text-align:center;color:var(--ink3)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.b-green{background:var(--green-s);color:#11793a}.b-red{background:var(--red-s);color:#b8232a}.b-amber{background:var(--amber-s);color:#a55d00}.b-blue{background:var(--pri-s);color:var(--pri-d)}.b-gray{background:#eef2f8;color:var(--ink2)}
.up{color:var(--green);font-weight:700;font-size:12px}.down{color:var(--red);font-weight:700;font-size:12px}
.muted{color:var(--ink3)}.tr{text-align:right}
.alert{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;font-weight:600}
.alert-amber{background:var(--amber-s);color:#8a4d00;border:1px solid #fbdc9c}.alert-amber svg{color:var(--amber)}
.alert-blue{background:var(--pri-s);color:var(--pri-d);border:1px solid #c6d8fb}

/* Dashboard */
.kpi{display:flex;gap:14px;align-items:flex-start}
.kpi .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.kpi .ic svg{width:26px;height:26px}
.kpi small{font-size:12.5px;color:var(--ink2);font-weight:600}
.kpi b{display:block;font-size:20px;font-weight:800;margin:2px 0;letter-spacing:-.02em}
.chart svg{width:100%;height:220px;display:block}
.stk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.stk:last-child{border:none}
.stk .x{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.stk b{font-weight:600;font-size:13px;display:block}.stk small{color:var(--ink3);font-size:12px}
.mini{display:flex;align-items:center;gap:14px}
.mini .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center}
.mini b{font-size:20px;font-weight:800}

/* Master tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;margin-bottom:22px}
.tile{padding:16px 8px!important;font-size:13px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;color:var(--ink);box-shadow:var(--sh);transition:.15s}
.tile svg{width:38px;height:38px;color:var(--pri);stroke-width:1.8}
.tile:hover{border-color:var(--pri);transform:translateY(-2px)}
.tile.on{border-color:var(--pri);background:var(--pri-s)}

/* POS */
.pos{display:grid;grid-template-columns:1fr 330px;gap:16px}
.pos-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pos-bar .srch{flex:1}
.kbd{font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:#f6f8fc}
.sugg{position:absolute;left:0;right:0;top:42px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,50,110,.14);z-index:20;max-height:280px;overflow:auto}
.sugg div{padding:9px 12px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.sugg div:hover,.sugg div.on{background:var(--pri-s)}
.sum-row{display:flex;justify-content:space-between;padding:7px 0;color:var(--ink2)}
.sum-tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 16px;border-top:1px solid var(--line);margin-top:6px}
.sum-tot span{font-size:18px;font-weight:800}.sum-tot b{font-size:24px;font-weight:800;color:var(--pri)}
.fkeys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.fkey{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:12.5px;color:var(--ink);box-shadow:var(--sh)}
.fkey svg{color:var(--pri)}.fkey small{color:var(--ink3);font-size:10.5px}
.fkey:hover{border-color:var(--pri)}.fkey.on{background:var(--pri-s);border-color:var(--pri)}
.bayar{width:100%;height:58px;font-size:20px;font-weight:800;border-radius:11px;margin-top:4px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg2 button{padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink2);border-left:1px solid var(--line)}.seg2 button:first-child{border-left:none}.seg2 button.on{background:var(--pri);color:#fff}
.qty{width:62px;height:30px;text-align:center;border:1px solid var(--line);border-radius:7px}

/* Barcode */
.lbl-prev{border:1.5px dashed #b9c8e6;border-radius:10px;padding:16px;display:flex;justify-content:center;background:#fafcff}
.label{width:240px;background:#fff;border:1px solid #222;border-radius:4px;padding:8px 10px 6px;text-align:center;color:#000}
.label .ap{font-weight:800;font-size:12px;letter-spacing:.04em}
.label .nm{font-size:10.5px;margin-top:1px}
.label svg{width:100%;height:56px;display:block;margin:4px 0 2px}
.label .no{font-size:15px;font-weight:600;letter-spacing:.08em;font-family:ui-monospace,Consolas,monospace}

/* Modal & toast */
.mbg{position:fixed;inset:0;background:rgba(15,30,60,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.mbg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,30,60,.3)}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.mh h3{flex:1;font-size:16px}
.mb{padding:18px 20px;overflow-y:auto}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:#123a8c;color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px rgba(15,30,60,.3);display:flex;gap:8px;align-items:center;animation:tin .25s}
.tst.warn{background:#a55d00}.tst.err{background:#b8232a}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input{width:17px;height:17px;accent-color:var(--pri)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px}.kv span{color:var(--ink2)}.kv b{font-weight:600}
.bigrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line2);font-size:14px}
.bigrow b{font-weight:800}

/* ===== Responsif ===== */
#loginBox{position:fixed;inset:0;z-index:300;background:linear-gradient(160deg,#e5eeff,#eef3fb 60%);display:none;align-items:center;justify-content:center;padding:16px}
.lg-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(20,50,110,.15);padding:28px 26px;width:100%;max-width:380px}
@media (max-width:600px){#syncSt .st-t{display:none}}
/* ===== Responsif: laptop kecil, tablet & HP ===== */
.grid>*,.pos>*{min-width:0}
.pos-mbar{display:none}
@media (max-width:1200px){.wrap{grid-template-columns:200px 1fr}main{padding:20px}.pos{grid-template-columns:1fr 290px}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:64px;z-index:40;width:260px;transform:translateX(-100%);transition:.2s;box-shadow:10px 0 30px rgba(15,30,60,.15)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:64px 0 0 0;background:rgba(15,30,60,.3);z-index:35}
  .burger{display:grid}
  .g3,.g2{grid-template-columns:1fr}
  .grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}
  .tiles{grid-template-columns:repeat(5,1fr)}
  .ph h1{font-size:20px}
}
@media (max-width:820px){
  .pos{grid-template-columns:1fr}
  .pos .bayar{display:none}
  .pos-mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,50,110,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom));align-items:center;gap:12px}
  .pos-mbar .t{flex:1;min-width:0}.pos-mbar small{color:var(--ink3);font-size:12px;display:block}.pos-mbar b{font-size:21px;font-weight:800;color:var(--pri)}
  .pos-mbar .btn{height:48px;padding:0 26px;font-size:16px}
  body.on-pos main{padding-bottom:100px}
  body.on-pos #toast{bottom:96px}
  .tiles{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:600px){
  main{padding:14px 12px 28px}
  .top{padding:0 10px;gap:6px;height:58px}
  .side{top:58px}body.nav-open .scrim{inset:58px 0 0 0}.wrap{min-height:calc(100vh - 58px)}
  .logo{gap:8px;min-width:0}.logo .cross{width:32px;height:32px}.logo>div{min-width:0}
  .logo b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logo small{display:none}
  .top .bell{width:36px}.user{padding:0}.user div{display:none}
  .ph{gap:8px;margin-bottom:12px}.ph h1{flex-basis:100%;font-size:19px}.ph .sp{display:none}
  .ph .sel{flex:1 1 140px;width:auto!important;min-width:0}.ph .btn{flex:1 1 auto}
  .card{padding:14px}.card-h{flex-wrap:wrap}
  .g4{grid-template-columns:1fr 1fr}
  .fgrid,.fgrid[style]{grid-template-columns:1fr!important}
  .frm{grid-template-columns:1fr;gap:4px}
  .tiles{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .tile{padding:12px 4px!important;font-size:11.5px!important;gap:6px;text-align:center;line-height:1.25}
  .tile svg{width:26px;height:26px}
  .fkeys{grid-template-columns:repeat(4,1fr);gap:6px}.fkey{font-size:11px;padding:8px 2px}
  .inp,.sel,textarea.inp{font-size:16px}
  .btn{height:42px}.btn-sm{height:34px}.ib{width:36px;height:36px}
  th,td{padding:8px 9px}
  .tabs{margin-bottom:14px}.tabs button{padding:9px 11px;font-size:13px}
  .kpi b{font-size:18px}.bigrow{font-size:13.5px}
  .mbg{padding:0;align-items:flex-end}
  .modal{max-width:100%!important;border-radius:16px 16px 0 0;max-height:94vh}
  .mh{padding:14px}.mb{padding:14px}
  .mf{flex-wrap:wrap;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}.mf .btn,.mf a.btn{flex:1 1 auto}
  /* keranjang POS ditampilkan sebagai kartu */
  .ctable thead{display:none}
  .ctable tr{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:2px 8px;padding:10px 6px;border-bottom:1px solid var(--line2)}
  .ctable td{padding:0;border:0}
  .ctable td:nth-child(1),.ctable td:nth-child(4){display:none}
  .ctable td:nth-child(2){grid-column:1;grid-row:1}
  .ctable td:nth-child(5){grid-column:2;grid-row:1;font-weight:700}
  .ctable td:nth-child(6){grid-column:3;grid-row:1}
  .ctable td:nth-child(3){grid-column:1/-1;grid-row:2;text-align:left!important;margin-top:6px}
  .ctable td.empty{display:block!important;grid-column:1/-1;padding:36px 8px!important}
  .pos-bar{flex-wrap:wrap}.pos-bar>b,.pos-bar .kbd{display:none}
}
@media (pointer:coarse){.nav a{padding:11px 12px}.ib{min-width:34px;min-height:34px}}
@media print{.top,.side,.ph .btn{display:none}.wrap{display:block}}
</style>
</head>
<body>

<header class="top">
  <button class="burger" onclick="document.body.classList.toggle('nav-open')" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
  <div class="logo">
    <img id="brandLogo" class="cross" alt="Logo" style="display:none;object-fit:contain;width:auto;max-width:120px;height:42px">
    <svg class="cross" id="brandCross" viewBox="0 0 40 40"><path d="M14 3h12v11h11v12H26v11H14V26H3V14h11z" fill="#22b573"/><path d="M14 3h12v11h11v12H26v11H14V26H3V14h11z" fill="none" stroke="#1d8f5a" stroke-width="1.5"/><path d="M20 12v16M12 20h16" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>
    <div><b id="brandName">Apotek Dian Farma</b><small id="brandTag">Sehat Bersama, Lebih Baik</small></div>
  </div>
  <div class="sp"></div>
  <span id="syncSt" style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-right:4px;cursor:default"></span>
  <button class="bell" onclick="go(SRV.newCount?'toko':'persediaan')" title="Notifikasi"><svg class="i"><use href="#i-bell"/></svg><span class="dot" id="bellDot"></span></button>
  <div class="user"><span class="av">A</span><div><b>Admin</b><small>Administrator</small></div></div>
</header>

<div class="wrap">
  <aside class="side"><nav class="nav" id="nav"></nav><div class="ver">Versi 1.0.0</div></aside>
  <div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
  <main id="main"></main>
</div>

<div class="mbg" id="mbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>

const inP=(t,n)=>t>=dAgo(n-1);
const sumBy=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function stats(n){
  const s=D.sales.filter(x=>inP(x.tgl,n)),ps=D.sales.filter(x=>x.tgl<dAgo(n-1)&&x.tgl>=dAgo(2*n-1));
  const p=D.purch.filter(x=>inP(x.tgl,n)),pp=D.purch.filter(x=>x.tgl<dAgo(n-1)&&x.tgl>=dAgo(2*n-1));
  const jual=sumBy(s,x=>x.total),beli=sumBy(p,x=>x.total),laba=sumBy(s,x=>x.total-x.pajak-x.hpp);
  const pj=sumBy(ps,x=>x.total),pb=sumBy(pp,x=>x.total),pl=sumBy(ps,x=>x.total-x.pajak-x.hpp);
  const g=(a,b)=>b?((a-b)/b*100):0;
  return {jual,beli,laba,gj:g(jual,pj),gb:g(beli,pb),gl:g(laba,pl),trx:sumBy(s,x=>x.trx||1),ppnK:sumBy(s,x=>x.pajak),ppnM:sumBy(p,x=>x.pajak||0)};
}
function daily(n,src='sales'){const out=[];for(let i=n-1;i>=0;i--){const d=dAgo(i);out.push({d,v:sumBy(D[src].filter(x=>x.tgl===d),x=>x.total)})}return out}
function barChart(data,h=220){
  const W=640,H=h,L=42,B=26,T=10,max=Math.max(1e6,...data.map(x=>x.v));
  const step=Math.ceil(max/1e6/3)*1e6||1e6,top=step*Math.ceil(max/step);
  const bw=(W-L-10)/data.length;let g='';
  for(let v=0;v<=top;v+=step){const y=H-B-(v/top)*(H-B-T);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#e8edf6"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#7d8aa5">${v/1e6} jt</text>`}
  data.forEach((x,i)=>{const bh=(x.v/top)*(H-B-T),bx=L+i*bw+bw*.22,w=bw*.56,y=H-B-bh;const [,m,d]=x.d.split('-');
    g+=`<rect x="${bx}" y="${y}" width="${w}" height="${Math.max(bh,1)}" rx="4" fill="url(#gb)"><title>${tgl(x.d)}: ${rp(x.v)}</title></rect>`;
    if(data.length<=10||i%Math.ceil(data.length/8)===0)g+=`<text x="${bx+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#7d8aa5">${+d}/${+m}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f74f0"/><stop offset="1" stop-color="#1d5fe0"/></linearGradient></defs>${g}</svg>`;
}
const growth=v=>`<span class="${v>=0?'up':'down'}">${v>=0?'↑':'↓'} ${Math.abs(v).toFixed(1)}%</span>`;

-items:center;font-weight:500"><input type="checkbox" id="f_online" ${o.online!==false?'checked':''}>Tampil di toko online</label><label style="display:flex;gap:7px;align-items:center;font-weight:500"><input type="checkbox" id="f_resep" ${o.resep?'checked':''}>Wajib resep dokter (obat keras)</label></div>`}

function obCalc(){const mode=$('#f_hargaMode').value,beli=+$('#f_beli').value||0,mg=$('#f_margin'),ju=$('#f_jual');
  if(mode==='persen'){ju.value=hitungJual(beli,+mg.value||0);ju.readOnly=true;mg.readOnly=false;ju.style.background='#f4f7fc';mg.style.background=''}
  else{ju.readOnly=false;mg.readOnly=true;ju.style.background='';mg.style.background='#f4f7fc';mg.value=beli?Math.round(((+ju.value||0)/beli-1)*1000)/10:0}
  const j=+ju.value||0;$('#obMg').innerHTML=beli?`Untung per ${esc($('#f_satuan').value)}: <b style="color:${j>=beli?'var(--green)':'var(--red)'}">${rp(j-beli)}</b>${mode==='persen'&&+D.config.bulat>1?` · dibulatkan ke atas per ${rp(D.config.bulat)}`:''}`:'Isi harga beli dulu'}
function obHint(){const e=$('#obHint');if(!e)return;obCalc();const k=$('#f_satuan').value,b=$('#f_satuanBesar').value,isi=+$('#f_isi').value||1,beli=+$('#f_beli').value||0,jual=+$('#f_jual').value||0,jb=+$('#f_jualBesar').value||0;
  $('#f_isi').disabled=!b;$('#f_jualBesar').disabled=!b;e.innerHTML=b&&isi>1?`1 ${esc(b)} = ${isi} ${esc(k)} · Harga beli per ${esc(b)}: <b>${rp(beli*isi)}</b> · Harga jual per ${esc(b)}: <b>${rp(jb||jual*isi)}</b>`:b?'Isi per satuan besar harus lebih dari 1':'Obat hanya memakai satuan kecil'}
function masterSave(i){
  const v=k=>{const e=$('#f_'+k);return e?e.value.trim():''};const edit=i!==undefined;
  if(MTAB==='obat'){if(!v('nama'))return toast('Nama obat wajib diisi','warn');
    const sb=v('satuanBesar'),isi=Math.max(1,+v('isi')||1);if(sb&&sb===v('satuan'))return toast('Satuan besar harus beda dengan satuan kecil','warn');if(sb&&isi<2)return toast('Isi per satuan besar minimal 2','warn');
    const o={nama:v('nama'),kategori:v('kategori'),satuan:v('satuan'),satuanBesar:sb,isi:sb?isi:1,jualBesar:sb?(+v('jualBesar')||0):0,barcode:v('barcode'),beli:+v('beli')||0,jual:+v('jual')||0,stok:+v('stok')||0,min:+v('min')||0,batch:v('batch'),ed:v('ed'),hargaMode:v('hargaMode'),margin:+v('margin')||0,online:$('#f_online').checked,resep:$('#f_resep').checked};
    if(o.hargaMode==='persen')o.jual=hitungJual(o.beli,o.margin);
    if(o.jual<o.beli&&!confirm('Harga jual lebih kecil dari harga beli. Tetap simpan?'))return;
    if(edit)Object.assign(D.obat[i],o);else{const nid=Math.max(0,...D.obat.map(x=>x.id))+1;D.obat.push({id:nid,...o});if(PB_NEW)setTimeout(()=>pbAdd(nid),0)}}
  else if(MTAB==='kategori'||MTAB==='satuan'){if(!v('nama'))return toast('Nama wajib diisi','warn');edit?D[MTAB][i]=v('nama'):D[MTAB].push(v('nama'))}
  else{const keys=MCOLS[MTAB].map(c=>c[0]);const x={};keys.forEach(k=>x[k]=NUMK.includes(k)?+v(k)||0:v(k));if(keys.some(k=>k!=='harga'&&NUMK.includes(k)&&(x[k]<0||x[k]>100)))return toast('Persentase harus 0–100%','warn');
    if(MTAB==='pelanggan'){x.tempo=$('#f_tempo').checked;x.termin=Math.max(1,+$('#f_termin').value||30);x.limit=Math.max(0,+$('#f_limit').value||0);x.pin=$('#f_pin').value.trim();if(x.pin&&!/^\d{6}$/.test(x.pin))return toast('PIN harus 6 angka','warn');if(x.nama==='Pelanggan Umum'&&x.tempo)return toast('Pelanggan Umum tidak bisa tempo','warn')}
    if(MTAB==='pelanggan'&&x.nama==='Pelanggan Umum'&&x.diskonOff)return toast('Pelanggan Umum tidak bisa diberi diskon off faktur','warn');
    if(MTAB==='harga'){if(!x.pelanggan)return toast('Pilih pelanggan','warn');if(D.harga.some((h,j)=>h.pelanggan===x.pelanggan&&j!==i))return toast(x.pelanggan+' sudah ada di daftar harga khusus','warn')}
    if(MTAB==='pelanggan'&&edit){const old=D.pelanggan[i].nama;if(old!==x.nama)D.harga.forEach(h=>{if(h.pelanggan===old)h.pelanggan=x.nama})}
    if(MTAB==='salesman'&&edit){const old=D.salesman[i].nama;if(old!==x.nama){D.komisi.forEach(k=>{if(k.salesman===old)k.salesman=x.nama})}}
    if(MTAB==='katpel'&&edit){const old=D.katpel[i].nama;if(old!==x.nama)D.pelanggan.forEach(p=>{if(p.kategori===old)p.kategori=x.nama})}
    if(!x[keys[0]])return toast('Data wajib diisi','warn');if(edit)Object.assign(D[MTAB][i],x);else D[MTAB].push({id:Date.now(),...x})}
  log((edit?'Mengubah ':'Menambah ')+MTAB);save();closeModal();render();toast('Data tersimpan');
}

function pbCalc(){const bruto=sumBy(PB.items,x=>x.qty*x.harga),net=sumBy(PB.items,x=>x.qty*x.harga*(1-(+x.disc||0)/100)),dItem=Math.round(bruto-net);

}

const C128='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');

function posMatches(){const q=($('#posq')?.value||'').trim().toLowerCase();if(!q)return[];return D.obat.filter(o=>o.barcode===q||o.nama.toLowerCase().includes(q)).slice(0,8)}

function posKey(e){const m=posMatches();if(e.key==='ArrowDown'){SUG=Math.min(SUG+1,m.length-1);posSug();e.preventDefault()}else if(e.key==='ArrowUp'){SUG=Math.max(SUG-1,0);posSug();e.preventDefault()}else if(e.key==='Enter'){if(m[SUG])posAdd(m[SUG].id);else if(e.target.value)toast('Obat tidak ditemukan','warn')}else if(e.key==='Escape'){e.target.value='';posSug()}}

function posUnit(i,isi){const x=CART[i],o=obatBy(x.id);x.isi=isi;x.unit=units(o).find(u=>u.isi===isi).nm;x.harga=posHarga(o,isi);const max=Math.floor((o.stok-posUsed(x.id,i))/isi);if(max<1){toast(`Stok tidak cukup untuk 1 ${x.unit}`,'warn');x.isi=1;x.unit=o.satuan;x.harga=posHarga(o,1)}else if(x.qty>max)x.qty=max;render()}

const payBonus=(t,sb)=>$('#pb_use')&&$('#pb_use').checked?Math.min(sb,t):0;
function payMetode(t,sb){const tp=$('#pm').value==='Tempo';$('#tempoBox').style.display=tp?'':'none';$('#pu').previousElementSibling.firstChild.textContent=tp?'Uang Muka / DP ':'Uang Diterima ';if(tp){$('#pu').value=0;$('#pq').innerHTML='';payUpd(t,sb,true)}else payUpd(t,sb)}
function payUpd(t,sb,typing){if($('#pm')&&$('#pm').value==='Tempo'){const due=t-payBonus(t,sb),dp=Math.min(+$('#pu').value||0,due);$('#pdue').textContent='';$('#pk').previousElementSibling.textContent='Masuk hutang';$('#pk').textContent=rp(due-dp);return}
  if($('#pk'))$('#pk').previousElementSibling.textContent='Kembalian';const due=t-payBonus(t,sb);if(!typing)$('#pu').value=due;$('#pdue').textContent=payBonus(t,sb)?`(sisa setelah bonus: ${rp(due)})`:'';
  $('#pk').textContent=rp(Math.max(0,(+$('#pu').value||0)-due));
  if(!typing)$('#pq').innerHTML=[due,Math.ceil(due/10000)*10000,Math.ceil(due/50000)*50000,100000].filter((v,i,a)=>a.indexOf(v)===i&&v>=due).map(v=>`<button class="btn btn-o btn-sm" onclick="$('#pu').value=${v};payUpd(${t},${sb},true)">${nf(v)}</button>`).join('')}

   `<button class="btn btn-o" onclick="closeModal();fpForm('${no}')">${ic('receipt')}Faktur Pajak</button><button class="btn btn-o" onclick='printStruk(${JSON.stringify({no,items,c,u,m,bp,tempo:tempo?{jt,piu,dp,total:hutangPel(PEL)}:null}).replace(/'/g,"&#39;")})'>${ic('print')}Cetak Struk</button><button class="btn btn-p" onclick="closeModal();render()">Transaksi Baru</button>`,440);

const saleBy=no=>D.sales.find(x=>x.no===no);
function fpForm(no){const s=saleBy(no);if(!s)return;if(!s.pajak)return toast('Transaksi ini tanpa PPN — aktifkan Pajak (F8) saat penjualan','warn');
  const p=pelBy(s.pelanggan)||{},f=s.fp||{nama:p.nama==='Pelanggan Umum'?'':p.nama||'',npwp:p.npwp||'',alamat:p.alamat&&p.alamat!=='-'?p.alamat:'',nomor:'',tgl:s.tgl};

   <div class="bigrow" style="margin-top:12px"><span>DPP</span><b>${rp(s.total-s.pajak)}</b></div><div class="bigrow"><span>PPN</span><b>${rp(s.pajak)}</b></div>
   ${p.nama&&p.nama!=='Pelanggan Umum'?`<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:500"><input type="checkbox" id="fp_sv" checked>Simpan NPWP &amp; alamat ke data pelanggan ${esc(p.nama)}</label>`:''}`,
   `<button class="btn btn-g" onclick="closeModal()">Batal</button><button class="btn btn-p" onclick="fpSave('${no}')">${ic('print')}Simpan &amp; Cetak</button>`,600)}
function fpSave(no){const s=saleBy(no),n=$('#fp_n').value.trim(),w=$('#fp_w').value.replace(/[^0-9]/g,''),a=$('#fp_a').value.trim();
  if(!n)return toast('Nama pembeli wajib diisi','warn');if(w.length!==15&&w.length!==16)return toast('NPWP / NIK harus 15 atau 16 digit','warn');if(!a)return toast('Alamat pembeli wajib diisi','warn');
  s.fp={no:s.fp?s.fp.no:'FP-'+$('#fp_t').value.slice(0,4)+'-'+String(++D.seq.fp).padStart(6,'0'),nomor:$('#fp_no').value.trim(),tgl:$('#fp_t').value,nama:n,npwp:w,alamat:a};
  const p=pelBy(s.pelanggan);if(p&&$('#fp_sv')&&$('#fp_sv').checked){p.npwp=w;p.alamat=a}
  log('Faktur pajak '+s.fp.no+' untuk '+no);save();closeModal();if(PAGE==='pajak')render();toast('Faktur pajak tersimpan');fpPrint(no)}
function fpPrint(no){const s=saleBy(no),f=s.fp,c=D.config;if(!f)return;const w=window.open('','_blank');if(!w)return toast('Pop-up diblokir browser — izinkan pop-up untuk mencetak','warn');
  const dpp=s.total-s.pajak,fx=s.ppnMode==='include'?100/(100+(s.ppnRate||c.ppn)):1,bruto=Math.round(s.subtotal*fx),potong=bruto-dpp;
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Faktur Pajak ${esc(f.nomor||f.no)}</title><style>

  .kv td{border:none;padding:.4mm 0}.kv td:first-child{width:28mm}.r{text-align:right}.c{text-align:center}
  .it th,.it td{border:1px solid #000;padding:1.4mm 2.4mm}.it th{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sm{font-size:8pt;color:#333}
  </style></head><body>
  <div style="position:relative;${D.config.logo&&D.config.logoCetak!==false?'min-height:17mm;padding-top:4mm':''}">${logoCetak('position:absolute;left:0;top:0;max-height:14mm;max-width:40mm;object-fit:contain')}<h1>Faktur Pajak</h1></div>
  <table class="box"><tr><td>Kode dan Nomor Seri Faktur Pajak: <b>${esc(f.nomor||'(diisi setelah terbit di Coretax)')}</b><span style="float:right" class="sm">Ref. ${esc(f.no)} · ${esc(s.no)}</span></td></tr>
  <tr><td class="h">Pengusaha Kena Pajak</td></tr><tr><td><table class="kv"><tr><td>Nama</td><td>: ${esc(c.nama)}</td></tr><tr><td>Alamat</td><td>: ${esc(c.alamat)}</td></tr><tr><td>NPWP</td><td>: ${esc(c.npwp)}</td></tr></table></td></tr>
  <tr><td class="h">Pembeli Barang Kena Pajak / Penerima Jasa Kena Pajak</td></tr><tr><td><table class="kv"><tr><td>Nama</td><td>: ${esc(f.nama)}</td></tr><tr><td>Alamat</td><td>: ${esc(f.alamat)}</td></tr><tr><td>NPWP / NIK</td><td>: ${esc(f.npwp)}</td></tr></table></td></tr></table>

  <script>onload=()=>setTimeout(()=>print(),200)<\\/script></body></html>`);w.document.close()}
function fpCSV(){const r=[['Tanggal Faktur','Nomor Faktur Coretax','Referensi','No Transaksi','NPWP/NIK Pembeli','Nama Pembeli','Alamat Pembeli','Harga Jual','Potongan','DPP','PPN']];
  D.sales.filter(x=>x.fp).forEach(x=>r.push([x.fp.tgl,x.fp.nomor,x.fp.no,x.no,"'"+x.fp.npwp,x.fp.nama,x.fp.alamat,...(()=>{const fx=x.ppnMode==='include'?100/(100+(x.ppnRate||D.config.ppn)):1,b=Math.round(x.subtotal*fx),dpp=x.total-x.pajak;return [b,b-dpp,dpp,x.pajak]})()]));
  if(r.length<2)return toast('Belum ada faktur pajak','warn');download('faktur-pajak-keluaran-'+today()+'.csv',csv(r),'text/csv');toast('CSV diunduh')}
function pajakCSV(){const r=[['Jenis','No','Tanggal','Lawan','DPP','PPN'],...D.sales.filter(x=>inP(x.tgl,30)).map(x=>['Keluaran',x.no,x.tgl,x.pelanggan,x.total-x.pajak,x.pajak]),...D.purch.filter(x=>inP(x.tgl,30)).map(x=>['Masukan',x.no,x.tgl,x.supplier,x.total-(x.pajak||0),x.pajak||0])];download('rekap-pajak-'+today()+'.csv',csv(r),'text/csv');toast('CSV diunduh')}

  return head('Laporan')+tabs('laporan',['Penjualan','Pembelian','Persediaan','Keuntungan','Custom'])+b;

function logoUpload(f){if(!f)return;if(!/^image\/(png|jpeg|webp|svg\+xml)$/.test(f.type))return toast('Format harus PNG, JPG, WEBP, atau SVG','warn');if(f.size>2*1024*1024)return toast('Ukuran file maksimal 2 MB','warn');
  const rd=new FileReader();rd.onload=()=>{if(f.type==='image/svg+xml'){if(/<script|on\w+\s*=/i.test(rd.result))return toast('File SVG berisi skrip — gunakan PNG/JPG','err');logoSet('data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(rd.result))));return}
    const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);logoSet(c.toDataURL('image/png'))};im.onerror=()=>toast('Gambar tidak bisa dibaca','err');im.src=rd.result};

async function api(p,opt={}){
  const r=await fetch(p,{method:opt.method||'GET',headers:{'Content-Type':'application/json',...(SRV.token?{Authorization:'Bearer '+SRV.token}:{})},body:opt.body!==undefined?JSON.stringify(opt.body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&p!=='/api/auth/login'){SRV.token=null;try{sessionStorage.removeItem('df-token')}catch(e){}showLogin('Sesi berakhir, silakan login lagi');throw new Error('Sesi berakhir')}
  if(!r.ok)throw Object.assign(new Error(j.message||('Gagal ('+r.status+')')),{status:r.status,body:j});
  return j}
function setSync(st){const e=$('#syncSt');if(!e)return;const M={demo:['Mode demo','#7d8aa5','Data hanya tersimpan di browser ini. Jalankan server agar tersambung ke toko online.'],ok:['Tersinkron','#16a34a','Data tersimpan di server'],saving:['Menyimpan…','#1d5fe0',''],err:['Gagal sinkron','#e0353b','Server tidak terjangkau, akan dicoba lagi']};

async function pushState(){if(SRV.busy){SRV.again=true;return}SRV.busy=true;

  catch(e){if(e.status===409){toast('Data diubah dari perangkat lain — memuat data terbaru','warn');try{await loadState()}catch(_){}}else if(e.status!==401){setSync('err');clearTimeout(SRV.t);SRV.t=setTimeout(pushState,10000)}}
  finally{SRV.busy=false;if(SRV.again){SRV.again=false;pushState()}}}

      <div class="tw"><table><thead><tr><th>Nama</th><th>Nomor HP</th><th>Status</th><th>Data apotek</th><th>Terdaftar</th><th>Terakhir masuk</th><th class="c">Aksi</th></tr></thead><tbody>${L.map(a=>`<tr><td><b style="font-weight:600">${esc(a.nama)}</b>${a.alamat?`<br><small class="muted">${esc(a.alamat)}</small>`:''}</td><td>${esc(a.telp)}</td><td>${a.verified?'<span class="badge b-green">Terhubung</span>':'<span class="badge b-gray">Belum terhubung</span>'}</td><td>${a.pelanggan?esc(a.pelanggan):(()=>{const p=D.pelanggan.find(x=>x.nama!=='Pelanggan Umum'&&normTelp(x.telp)===a.telp);return p?`<span class="muted">${esc(p.nama)} ${p.pin?'(punya PIN)':'— <a style="cursor:pointer;color:var(--pri)" onclick="MTAB=\'pelanggan\';go(\'master\')">buat PIN</a>'}</span>`:'<span class="muted">-</span>'})()}</td><td style="white-space:nowrap">${new Date(a.created_at).toLocaleDateString('id-ID')}</td><td style="white-space:nowrap">${a.last_login?new Date(a.last_login).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}):'-'}</td><td class="c" style="white-space:nowrap"><button class="btn btn-o btn-sm" onclick="akunReset('${esc(a.telp)}')">Reset password</button><button class="ib del" title="Hapus akun" onclick="akunHapus('${esc(a.telp)}')">${ic('trash')}</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Belum ada pelanggan yang mendaftar di toko online</td></tr>'}</tbody></table></div></div>`}
  }else{const k=D.config.toko=D.config.toko||{};const F=(key,l,ty='text',ph='')=>`<div class="fld"><label>${l}</label><input class="inp" id="tk_${key}" type="${ty}" value="${esc(k[key]??'')}" placeholder="${esc(ph)}"></div>`;
    b=`<div class="grid" style="grid-template-columns:1fr 320px" id="setRow"><div class="card"><h3>Pengaturan Toko Online</h3>
     <label style="display:flex;gap:10px;align-items:center;font-weight:600;margin-bottom:14px"><input type="checkbox" id="tk_buka" ${k.buka!==false?'checked':''} style="width:18px;height:18px;accent-color:var(--pri)">Toko buka (menerima pesanan)</label>
     <div class="fgrid">${F('ongkir','Ongkos kirim (Rp)','number','10000')}${F('gratisOngkir','Gratis ongkir mulai belanja (Rp, 0 = tidak ada)','number','0')}${F('minBelanja','Minimal belanja (Rp)','number','0')}${F('wa','Nomor WhatsApp apotek','text','08xxxxxxxxxx')}${F('jam','Jam buka','text','Senin–Sabtu 08.00–21.00')}${F('info','Pengumuman di toko','text','mis. Gratis ongkir area kota')}</div>
     <div class="fld" style="margin-top:12px"><label>Metode pembayaran</label><div style="display:flex;gap:18px;flex-wrap:wrap">${[['transfer','Transfer Bank'],['qris','QRIS'],['cod','Bayar di Tempat']].map(([v,l])=>`<label style="display:flex;gap:6px;align-items:center;font-weight:500"><input type="checkbox" class="tk_bayar" value="${v}" ${(k.bayar||['transfer','qris','cod']).includes(v)?'checked':''}>${l}</label>`).join('')}</div></div>
     <div class="fld" style="margin-top:12px"><label>Rekening bank (satu per baris)</label><textarea class="inp" id="tk_rekening" rows="3" placeholder="BCA 1234567890 a.n. Apotek Dian Farma">${esc(k.rekening||'')}</textarea></div>
     <div class="fld" style="margin-top:12px"><label>Gambar QRIS</label><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${k.qris?`<img src="${k.qris}" alt="QRIS" style="width:90px;height:90px;object-fit:contain;border:1px solid var(--line);border-radius:8px">`:'<span class="muted">Belum ada</span>'}<input type="file" id="tk_qf" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="qrisUpload(this.files[0]);this.value=''"><button class="btn btn-o btn-sm" onclick="$('#tk_qf').click()">${ic('upl')}Unggah QRIS</button>${k.qris?`<button class="btn btn-red btn-sm" onclick="D.config.toko.qris='';save();render()">Hapus</button>`:''}</div></div>
     <p class="muted" style="font-size:12.5px;margin-top:12px">Produk yang tampil diatur di Master Data → Data Obat (centang "Tampil di toko online"). Obat bertanda "Wajib resep" hanya bisa dipesan dengan foto resep.</p>
     <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn btn-p" onclick="tokoSave()">${ic('save')}Simpan Pengaturan</button></div></div>
     <div class="card"><h3>Server &amp; Akun</h3>${SRV.on?`<div class="kv" style="margin-bottom:14px"><span>Status :</span><b style="color:var(--green)">Tersambung</b><span>Toko :</span><b><a href="/toko" target="_blank" rel="noopener">${esc(location.origin)}/toko</a></b><span>Admin :</span><b>${esc(location.origin)}/</b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-o btn-sm" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.origin+'/toko').then(()=>toast('Link toko disalin'))">Salin link toko</button><button class="btn btn-o btn-sm" onclick="pwForm()">Ganti password</button><button class="btn btn-red btn-sm" onclick="logout()">Keluar</button></div>`:'<p class="muted">Mode demo — aplikasi tidak dibuka lewat server. Pengaturan tetap tersimpan dan akan dipakai setelah server dijalankan.</p>'}</div></div>`}
  return head('Toko Online',SRV.on?`<a class="btn btn-o" href="/toko" target="_blank" rel="noopener">${ic('eye')}Buka Toko</a>`:'')+tabs('toko',['Pesanan','Akun Pelanggan','Pengaturan Toko'])+b};
AFTER.toko=()=>{const r=$('#setRow');if(r&&innerWidth<900)r.style.gridTemplateColumns='1fr'};
async function loadAkun(){try{SRV.akun=(await api('/api/admin/akun')).items;if(PAGE==='toko'&&T.toko==='Akun Pelanggan')render()}catch(e){toast(e.message,'err')}}
async function akunReset(telp){try{const j=await api('/api/admin/akun/'+telp+'/reset',{method:'POST',body:{}});const a=(SRV.akun||[]).find(x=>x.telp===telp)||{};
  openModal('Password baru',`<p>Password baru untuk <b>${esc(a.nama||telp)}</b>:</p><div style="font-size:22px;font-weight:800;letter-spacing:.06em;margin:12px 0;color:var(--pri)">${esc(j.password)}</div><p class="muted" style="font-size:12.5px">Berikan ke pelanggan, lalu minta ia menggantinya di menu Akun Saya. Password ini tidak ditampilkan lagi.</p>`,
  `<button class="btn btn-g" onclick="closeModal()">Tutup</button><a class="btn btn-p" target="_blank" rel="noopener" href="https://wa.me/${telp.replace(/^0/,'62')}?text=${encodeURIComponent('Password baru akun toko online '+D.config.nama+': '+j.password+' — silakan masuk lalu ganti password di menu Akun Saya.')}">Kirim via WA</a>`,420);log('Reset password akun toko '+telp)}catch(e){toast(e.message,'err')}}
function akunHapus(telp){openModal('Hapus akun?',`<p>Akun toko online <b>${esc(telp)}</b> akan dihapus. Data pelanggan di apotek dan riwayat pesanan tidak ikut terhapus.</p>`,`<button class="btn btn-g" onclick="closeModal()">Batal</button><button class="btn btn-red" onclick="api('/api/admin/akun/${esc(telp)}',{method:'DELETE'}).then(()=>{closeModal();toast('Akun dihapus');loadAkun()}).catch(e=>toast(e.message,'err'))">Hapus</button>`,420)}
function tokoSave(){const k=D.config.toko=D.config.toko||{};k.buka=$('#tk_buka').checked;['ongkir','gratisOngkir','minBelanja'].forEach(x=>k[x]=Math.max(0,+$('#tk_'+x).value||0));['wa','jam','info'].forEach(x=>k[x]=$('#tk_'+x).value.trim());
  k.rekening=$('#tk_rekening').value.trim();k.bayar=[...document.querySelectorAll('.tk_bayar:checked')].map(e=>e.value);if(!k.bayar.length)return toast('Pilih minimal satu metode pembayaran','warn');
  log('Ubah pengaturan toko online');save();render();toast('Pengaturan toko tersimpan')}
function qrisUpload(f){if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type))return toast('Format harus PNG/JPG/WEBP','warn');const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);D.config.toko=D.config.toko||{};D.config.toko.qris=c.toDataURL('image/png');save();render();toast('QRIS diunggah')};im.src=rd.result};rd.readAsDataURL(f)}
async function orderDetail(kode){let o;try{o=(await api('/api/admin/orders/'+encodeURIComponent(kode))).data}catch(e){return toast(e.message,'err')}
  window._ord=o;const st=OST[o.status],wa=normTelp(o.telp).replace(/^0/,'62');
  const stokOk=o.items.every(i=>{const ob=obatBy(i.id);return ob&&ob.stok>=i.qty*i.isi});const act=[];
  if(o.status==='baru')act.push(`<button class="btn btn-red" onclick="orderBatal('${esc(kode)}')">Batalkan</button>`,`<button class="btn btn-p" onclick="orderProses('${esc(kode)}')" ${stokOk?'':'disabled style="opacity:.5"'}>${ic('check')}Proses Pesanan</button>`);
  if(o.status==='diproses')act.push(o.kirim==='antar'?`<button class="btn btn-o" onclick="orderStatus('${esc(kode)}','dikirim')">${ic('truck')}Tandai Dikirim</button>`:`<button class="btn btn-o" onclick="orderStatus('${esc(kode)}','siap')">${ic('box')}Siap Diambil</button>`);
  if(['diproses','dikirim','siap'].includes(o.status))act.push(`<button class="btn btn-p" onclick="orderSelesai('${esc(kode)}')">${ic('check')}Selesai${o.bayar==='cod'?' &amp; Uang Diterima':''}</button>`);
  const img=(src,l)=>`<div><div class="lbl" style="margin-bottom:4px">${l}</div><img src="${src}" alt="${l}" style="width:100%;max-height:260px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fafcff"></div>`;
  const warn=s=>`<div class="alert alert-amber" style="margin-top:10px;font-size:12.5px">${s}</div>`;
  openModal(`Pesanan ${esc(kode)} <span class="badge ${st[1]}" style="margin-left:6px;vertical-align:middle">${st[0]}</span>`,`
   <div class="grid g2" style="gap:14px;margin-bottom:12px"><div><div class="lbl">Pelanggan</div><b>${esc(o.nama)}</b><br>${esc(o.telp)} · <a href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">Chat WhatsApp</a>${o.kategori?`<br><span class="badge b-blue">${esc(o.kategori)} · diskon ${o.diskonPct}%</span>`:''}</div>
   <div><div class="lbl">Pengiriman &amp; Pembayaran</div>${o.kirim==='antar'?'Diantar ke: '+esc(o.alamat):'Ambil di apotek'}<br>${esc(o.bayarLabel)}${o.saleNo?`<br><small class="muted">No. penjualan: ${esc(o.saleNo)}</small>`:''}${o.alasan?`<br><small style="color:var(--red)">Dibatalkan: ${esc(o.alasan)}</small>`:''}</div></div>
   ${o.catatan?`<div class="alert alert-blue" style="margin-bottom:12px;font-weight:500">Catatan pelanggan: ${esc(o.catatan)}</div>`:''}
   <div class="tw"><table><thead><tr><th>Obat</th><th class="c">Jumlah</th><th class="r">Harga</th><th class="r">Subtotal</th>${o.status==='baru'?'<th class="r">Stok</th>':''}</tr></thead><tbody>${o.items.map(i=>{const ob=obatBy(i.id),need=i.qty*i.isi;return `<tr><td>${esc(i.nama)}${i.resep?' <span class="badge b-amber">Resep</span>':''}</td><td class="c">${i.qty} ${esc(i.unit)}</td><td class="r num">${nf(i.harga)}</td><td class="r num">${nf(i.sub)}</td>${o.status==='baru'?`<td class="r">${ob?`<span class="badge ${ob.stok>=need?'b-green':'b-red'}">${stokTxt(ob)}</span>`:'<span class="badge b-red">tidak ada</span>'}</td>`:''}</tr>`}).join('')}</tbody></table></div>
   <div style="display:flex;justify-content:flex-end"><div style="min-width:260px;margin-top:8px"><div class="sum-row"><span>Subtotal</span><b>${rp(o.subtotal)}</b></div>${o.diskon?`<div class="sum-row"><span>Diskon ${esc(o.kategori||'')} ${o.diskonPct}%</span><b>−${rp(o.diskon)}</b></div>`:''}<div class="sum-row"><span>Ongkir</span><b>${rp(o.ongkir)}</b></div><div class="sum-row" style="font-size:15px;color:var(--ink)"><b>Total</b><b>${rp(o.total)}</b></div></div></div>
   ${o.resepImg||o.buktiImg?`<div class="grid g2" style="gap:12px;margin-top:10px">${o.resepImg?img(o.resepImg,'Foto resep'):''}${o.buktiImg?img(o.buktiImg,'Bukti pembayaran'):''}</div>`:''}
   ${o.status==='baru'&&o.adaResep?warn('Apoteker wajib memeriksa resep (nama pasien, dokter, tanggal, tanda tangan) sebelum memproses.'):''}
   ${o.status==='baru'&&o.bayar!=='cod'&&!o.adaBukti?warn('Pelanggan belum mengunggah bukti pembayaran. Pastikan dana sudah masuk sebelum memproses.'):''}
   ${o.status==='baru'&&!stokOk?warn('Stok tidak cukup untuk memproses pesanan ini.'):''}
   ${o.status==='baru'?(()=>{const pm=D.pelanggan.find(x=>x.nama!=='Pelanggan Umum'&&normTelp(x.telp)===normTelp(o.telp)),r=+o.ppn||0,net=o.subtotal-o.diskon,dpp=net-(r?Math.round(net*r/(100+r)):0),bo=pm&&pm.diskonOff?Math.round(dpp*pm.diskonOff/100):0;
     return `<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:14px;padding:12px;background:#f6f9ff;border:1px solid var(--line);border-radius:9px"><div class="fld" style="flex:1;min-width:200px;margin:0"><label>Salesman (komisi)</label><select class="sel" id="od_sales" onchange="odPrev(${dpp})"><option value="">— Tanpa salesman —</option>${D.salesman.map(x=>`<option value="${x.id}">${esc(x.nama)} (${x.komisi}%)</option>`).join('')}</select></div>
       <div style="font-size:12.5px;line-height:1.7">${pm?`Pelanggan terdaftar: <b>${esc(pm.nama)}</b>${marginOf(pm.nama)!=null?` · harga khusus beli +${marginOf(pm.nama)}%`:''}<br>Bonus off faktur ${pm.diskonOff||0}%: <b>${rp(bo)}</b>`:'Pelanggan baru — akan ditambahkan ke data pelanggan'}<br><span id="od_kom">Komisi: Rp 0</span></div></div>`})():''}
   <div class="lbl" style="margin-top:14px">Riwayat</div><div style="font-size:12.5px;line-height:1.7">${o.riwayat.map(r=>`<div>${new Date(r.t).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})} — <b>${esc((OST[r.status]||[r.status])[0])}</b>${r.ket?' · '+esc(r.ket):''}</div>`).join('')}</div>`,
   `<button class="btn btn-g" onclick="closeModal()">Tutup</button>${act.join('')}`,780)}
function odPrev(dpp){const sl=slsBy($('#od_sales').value);$('#od_kom').textContent='Komisi'+(sl?' '+sl.nama:'')+': '+rp(sl?Math.round(dpp*sl.komisi/100):0)}
async function orderStatus(kode,st,ket){try{await api('/api/admin/orders/'+encodeURIComponent(kode),{method:'PATCH',body:{status:st,ket:ket||''}});closeModal();toast('Status pesanan diperbarui');log(`Pesanan online ${kode}: ${st}`);save();await pollOrders()}catch(e){toast(e.message,'err');if(e.status===409){closeModal();pollOrders()}}}
async function orderProses(kode){const o=window._ord;if(!o||o.kode!==kode)return;const sl=$('#od_sales')?slsBy($('#od_sales').value):null;
  for(const i of o.items){const ob=obatBy(i.id);if(!ob||ob.stok<i.qty*i.isi)return toast(`Stok ${i.nama} tidak cukup`,'warn')}
  const no='PJ-'+today().replace(/-/g,'')+'-'+String(D.seq.pj+1).padStart(4,'0');
  try{await api('/api/admin/orders/'+encodeURIComponent(kode),{method:'PATCH',body:{status:'diproses',saleNo:no,ket:'Pesanan diproses'}})}catch(e){toast(e.message,'err');closeModal();return pollOrders()}
  D.seq.pj++;
  let p=D.pelanggan.find(x=>x.nama!=='Pelanggan Umum'&&normTelp(x.telp)===normTelp(o.telp));
  if(!p){p={id:Date.now(),nama:o.nama,kategori:'Umum',diskonOff:0,telp:o.telp,alamat:o.alamat||'-',npwp:''};D.pelanggan.push(p)}
  const r=+o.ppn||0,net=o.subtotal-o.diskon,pj=r?Math.round(net*r/(100+r)):0,tot=net+o.ongkir,cod=o.bayar==='cod',dpp=net-pj;
  const off=p.diskonOff?Math.round(dpp*p.diskonOff/100):0,kom=sl?Math.round(dpp*sl.komisi/100):0;
  const items=o.items.map(i=>({id:i.id,nama:i.nama,qty:i.qty,isi:i.isi,unit:i.unit,harga:i.harga}));
  const hpp=sumBy(items,i=>i.qty*i.isi*(obatBy(i.id).beli||0));
  items.forEach(i=>{const n=i.qty*i.isi;obatBy(i.id).stok-=n;addMutasi(i.id,'Penjualan Online',no,0,n)});
  D.sales.push({no,tgl:today(),pelanggan:p.nama,items,subtotal:o.subtotal,diskon:o.diskon,kategori:o.kategori||'Umum',diskonPct:o.diskonPct||0,pajak:pj,ppnMode:r?'include':'none',ppnRate:r,total:net,hpp,metode:o.bayarLabel+' (online)',bayar:tot,trx:1,online:o.kode,ongkir:o.ongkir,salesman:sl?sl.nama:'',komisi:kom,diskonOff:off});
  if(off)D.bonus.push({tgl:today(),pelanggan:p.nama,ref:no,jenis:'Bonus off faktur (online '+o.kode+')',dasar:dpp,persen:p.diskonOff,jumlah:off});
  if(kom)D.komisi.push({tgl:today(),salesman:sl.nama,ref:no,jenis:'Komisi penjualan online',dasar:dpp,jumlah:kom});
  if(cod)D.piutang.push({pihak:p.nama,ref:o.kode,jumlah:tot,jt:iso(new Date(Date.now()+3*864e5)),status:'Belum Lunas'});
  else D.kas.push({tgl:today(),uraian:'Penjualan online '+o.kode,jenis:'Pemasukan',akun:'Bank BCA',jumlah:tot});
  jurnal('Penjualan online '+o.kode,[cod?['113','Piutang Usaha',tot,0]:['112','Bank BCA',tot,0],['412','Pendapatan Penjualan',0,net-pj],['213','PPN Keluaran',0,pj],['413','Pendapatan Ongkir',0,o.ongkir],['511','HPP',hpp,0],['121','Persediaan',0,hpp],['613','Beban Diskon Off Faktur',off,0],['214','Utang Bonus Pelanggan',0,off],['612','Beban Komisi Salesman',kom,0],['215','Utang Komisi Salesman',0,kom]].filter(l=>l[2]||l[3]));
  log('Proses pesanan online '+o.kode+' → '+no);save();closeModal();toast('Pesanan diproses · stok dipotong · '+no);await pollOrders()}
async function orderSelesai(kode){const o=window._ord;
  try{await api('/api/admin/orders/'+encodeURIComponent(kode),{method:'PATCH',body:{status:'selesai',ket:o&&o.bayar==='cod'?'Uang diterima':''}})}catch(e){toast(e.message,'err');if(e.status===409){closeModal();pollOrders()}return}
  if(o&&o.bayar==='cod'){const i=D.piutang.findIndex(h=>h.ref===kode&&h.status!=='Lunas');if(i>=0)lunasi('piutang',i)}
  log('Pesanan online selesai '+kode);save();closeModal();toast('Pesanan selesai');await pollOrders()}
function orderBatal(kode){openModal('Batalkan pesanan?',`<div class="fld"><label>Alasan (akan dilihat pelanggan)</label><input class="inp" id="ob_a" placeholder="mis. stok habis / resep tidak valid"></div>`,`<button class="btn btn-g" onclick="orderDetail('${esc(kode)}')">Kembali</button><button class="btn btn-red" onclick="if(!$('#ob_a').value.trim())return toast('Isi alasan pembatalan','warn');orderStatus('${esc(kode)}','dibatalkan',$('#ob_a').value.trim())">Batalkan Pesanan</button>`,440)}

/* ---------- Pintasan keyboard (POS) ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#mbg').classList.contains('show'))return closeModal();
  if(PAGE!=='pos'||$('#mbg').classList.contains('show'))return;
  const k={F1:posNew,F2:()=>$('#posq').focus(),F4:posClear,F5:posDisk,F8:posPajak,F9:posPay}[e.key];
  if(k){e.preventDefault();k()}
});

const h0=location.hash.slice(1);if(PAGES[h0])PAGE=h0;
render();srvInit();
