# ============================================================
#  APOTEK DIAN FARMA (apotek-app) — Install / Update untuk CasaOS
#
#  SUDAH TERPASANG VERSI LAMA (SehatFarma)?
#   Cukup buka CasaOS → aplikasi apotek-sehatfarma → Update / Rebuild.
#   Image, port (3002), dan folder data SAMA, jadi tidak perlu ubah apa pun.
#   Saat pertama jalan, data lama otomatis diimpor ke aplikasi baru.
#   File data lama (apotek.db) tidak diubah — tetap aman.
#
#  INSTAL BARU:
#   1. CasaOS → App Store → "Install a customized app" (ikon +)
#   2. Pilih "Import" lalu tempel seluruh isi file ini → Install
#
#  Setelah jalan:
#   - Aplikasi apotek (admin) : http://<IP-SERVER>:3002/
#   - Toko online pelanggan   : http://<IP-SERVER>:3002/toko
#   - Login awal: admin / admin123 → aplikasi langsung minta ganti password
#     (password lama aplikasi SehatFarma TIDAK ikut pindah)
#
#  Catatan: aplikasi "apotek-online" yang lama tidak dipakai lagi —
#  penggantinya toko online bawaan di /toko.
# ============================================================

name: apotek-sehatfarma

services:
  apotek-sehatfarma:
    image: ghcr.io/mentionabbe-wq/apotek-sehatfarma:latest
    container_name: apotek-sehatfarma
    restart: unless-stopped
    ports:
      - "3002:3000"          # host 3002 -> container 3000
    environment:
      - PORT=3000
      - DB_DIR=/app/data
    volumes:
      - /DATA/AppData/apotek-sehatfarma/data:/app/data   # database persisten (aman saat update)
